# Checks that apply to any repo holding a DIMS dashboard or the DIMS code.
#
# The point is that a broken analysis script or an invalid config should not be
# discovered by a visitor to the published site.
name: Reusable — dashboard CI

on:
  workflow_call:
    inputs:
      python_paths:
        description: Space-separated directories of Python to syntax-check.
        type: string
        default: "opt"
      js_glob:
        description: Glob of JavaScript to syntax-check.
        type: string
        default: "js/*.js"
      config_path:
        description: config.json to validate, or "" to skip.
        type: string
        default: "config.json"
      check_assets:
        description: Also require that files named by the config exist.
        type: boolean
        default: true
      max_file_mb:
        description: Fail if a file added in this change exceeds this size.
        type: number
        default: 25

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: |
          for d in ${{ inputs.python_paths }}; do
            [ -d "$d" ] && python -m compileall -q "$d" || true
          done

      - name: JavaScript syntax
        run: |
          shopt -s nullglob
          files=(${{ inputs.js_glob }})
          if [ ${#files[@]} -eq 0 ]; then echo "no JS matched — skipping"; exit 0; fi
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Validate config.json
        if: inputs.config_path != ''
        run: |
          python -m pip install -q jsonschema requests
          python - <<'PY'
          import json, os, sys, urllib.request
          cfg_path = "${{ inputs.config_path }}"
          if not os.path.exists(cfg_path):
              print(f"{cfg_path} not present — skipping"); sys.exit(0)
          url = "https://raw.githubusercontent.com/dims-network/dims/main/docs/contracts/config.schema.json"
          try:
              schema = json.loads(urllib.request.urlopen(url, timeout=20).read())
          except Exception as exc:
              print(f"::warning::could not fetch the schema ({exc}); skipping validation")
              sys.exit(0)
          import jsonschema
          cfg = json.load(open(cfg_path))
          errors = list(jsonschema.Draft202012Validator(schema).iter_errors(cfg))
          for e in errors:
              print(f"::error file={cfg_path}::{list(e.path)}: {e.message}")
          if errors:
              sys.exit(1)
          print(f"{cfg_path} is valid")

          if "${{ inputs.check_assets }}" != "true":
              sys.exit(0)
          # Every data type promised by the config must have a file behind it.
          missing = []
          for vid, types in (cfg.get("dataTypes") or {}).items():
              for dt in types:
                  p = f"assets/timeseries/{vid}_{dt}.csv"
                  if not os.path.exists(p):
                      missing.append(p)
          if missing:
              # A warning, not an error: private cases keep assets out of git on
              # purpose, and this job cannot tell that from a genuine omission.
              for p in missing[:20]:
                  print(f"::warning::config names a file that is not in the repo: {p}")
          PY

      - name: Large file guard
        run: |
          limit=$(( ${{ inputs.max_file_mb }} * 1024 * 1024 ))
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "not a pull request — checking the last commit only"
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          fail=0
          # Only files ADDED by this change, so existing large assets in history
          # do not make every future run red.
          while read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(( size / 1024 / 1024 )) MB exceeds the ${{ inputs.max_file_mb }} MB limit. Use Git LFS or keep it out of the repo."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=A "$base" HEAD)
          exit $fail
